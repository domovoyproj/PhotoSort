name: Windows application
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: node --check photosort/web/app.js
      - run: .\packaging\build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-windows-x64
          path: |
            dist/*.zip
            dist/*Setup*.exe
            dist/SHA256SUMS*.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release PhotoSort 0.4.0')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoSort-windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          RELEASE_TAG="v${RELEASE_VERSION}"
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "PhotoSort $RELEASE_TAG" --notes-file docs/RELEASE-0.4.md
